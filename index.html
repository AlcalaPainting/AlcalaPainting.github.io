<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Try fresh paint colors on four geometric homes from Alcala Painting.">
  <meta name="theme-color" content="#ffffff">
  <title>Alcala Painting</title>
  <link rel="stylesheet" href="styles.css">
  <script src="paint.js" defer></script>
</head>
<body>
  <header class="site-header frame">
    <a href="./" class="wordmark"><span class="brand-mark" aria-hidden="true"></span> Alcala Painting</a>
    <a class="header-link" href="#paint">Try the colors <span aria-hidden="true">↓</span></a>
  </header>

  <main>
    <section class="intro frame">
      <h1>A fresh coat<br>changes <em>everything.</em></h1>
      <p>See what a little color can do.</p>
      <a class="intro-link" href="#paint">Explore the neighborhood <span aria-hidden="true">↓</span></a>
    </section>

    <section class="neighborhood" id="paint" aria-labelledby="paint-title">
      <div class="frame">
        <div class="section-heading">
          <h2 id="paint-title">Paint the neighborhood.</h2>
          <p>Hover over or tap a building to repaint it.</p>
        </div>

        <div class="buildings">
          <button class="building cottage" type="button" data-finish="0" aria-label="Repaint the cottage" disabled>
            <span class="layer top" aria-hidden="true"><span class="windows"><i></i></span></span>
            <span class="layer ground" aria-hidden="true"><span class="windows"><i></i><i></i></span><span class="door"></span></span>
          </button>
          <button class="building apartments" type="button" data-finish="0" aria-label="Repaint the apartments" disabled>
            <span class="layer top" aria-hidden="true"><span class="windows"><i></i></span></span>
            <span class="layer middle" aria-hidden="true"><span class="windows"><i></i><i></i></span></span>
            <span class="layer ground" aria-hidden="true"><span class="windows"><i></i><i></i></span><span class="door"></span></span>
          </button>
          <button class="building bungalow" type="button" data-finish="0" aria-label="Repaint the bungalow" disabled>
            <span class="layer top" aria-hidden="true"><span class="windows"><i></i></span></span>
            <span class="layer ground" aria-hidden="true"><span class="windows"><i></i><i></i></span><span class="door"></span></span>
          </button>
          <button class="building townhouse" type="button" data-finish="0" aria-label="Repaint the townhouse" disabled>
            <span class="layer top" aria-hidden="true"><span class="windows"><i></i></span></span>
            <span class="layer middle" aria-hidden="true"><span class="windows"><i></i></span></span>
            <span class="layer ground" aria-hidden="true"><span class="windows"><i></i></span><span class="door"></span></span>
          </button>
        </div>
        <p class="visually-hidden" role="status" id="paint-status"></p>
      </div>
    </section>
  </main>

  <footer class="site-footer frame">
    <span class="wordmark"><span class="brand-mark" aria-hidden="true"></span> Alcala Painting</span>
    <a class="header-link" href="#">Back to top <span aria-hidden="true">↑</span></a>
  </footer>
</body>
</html>
